<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/png" href="assets/logo's/logo-happy.png">
    <title>Product Page</title>
</head>

<body>

    <div class="sideMenu">
        <h2>Categories</h2>
        <ul id="category-list">
        </ul>
    </div>

    <div class="container">
        <header>
            <h1>Kiosk Menu</h1>
            <p class="subtitle">Prepared fresh every day with healthy ingredients.</p>
        </header>
        <div id="loading" class="loading">Het menu is aan het laden...</div>
        <div id="product-container"></div>
    </div>

    <script>

        let cart = [];
        let allProducts = [];

        fetch('./api/menu.php')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                console.log('Menu data:', data);
            })
            .catch(error => console.error('Error fetching menu:', error));

        const container = document.getElementById('product-container');
        const loading = document.getElementById('loading');

        async function fetchProducts() {
            try {

                const response = await fetch('./api/list.php');

                if (!response.ok) throw new Error('Failed to load products');

                const data = await response.json();

                allProducts = data.records;

                renderProducts(allProducts);

            } catch (error) {

                console.error('Error fetching products:', error);

                loading.innerHTML = `<div class="error-msg">Error: ${error.message}. Please make sure the API is running.</div>`;
            }
        }

        // vul categorieën links
        function renderCategoryList(products) {
            const categoryList = document.getElementById("category-list");

            // unieke categorieën ophalen
            const uniqueCategories = [...new Set(products.map(p => p.category))];

            uniqueCategories.forEach(category => {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = "#" + category.replace(/\s+/g, '-'); // id safe
                a.textContent = category;
                a.addEventListener("click", e => {
                    e.preventDefault();
                    const target = document.getElementById(category.replace(/\s+/g, '-'));
                    if (target) {
                        target.scrollIntoView({ behavior: "smooth", block: "start" });
                    }
                });
                li.appendChild(a);
                categoryList.appendChild(li);
            });
        }

        // update renderProducts zodat elke sectie een id krijgt
        function renderProducts(products) {

            loading.style.display = 'none';

            const categories = {};

            products.forEach(product => {
                if (!categories[product.category]) categories[product.category] = [];
                categories[product.category].push(product);
            });

            container.innerHTML = ""; // eerst leegmaken

            for (const [category, items] of Object.entries(categories)) {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.id = category.replace(/\s+/g, '-'); // id voor scrollen

                section.innerHTML = `
            <h2 class="category-title">${category}</h2>
            <div class="product-grid">
                ${items.map((item, index) => `
                    <div class="product-card"
                        onclick="addToCart(${item.id})"
                        style="animation-delay: ${index * 0.1}s">

                        <div class="image-container">
                            <img src="assets/img/${item.image || 'placeholder.png'}"
                                 alt="${item.name}"
                                 class="product-image"
                                 onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">

                            <span class="price-badge">€${item.price.toFixed(2)}</span>
                            ${item.kcal ? `<span class="kcal-badge">${item.kcal} kcal</span>` : ''}
                        </div>

                        <div class="product-info">
                            <h3 class="product-name">${item.name}</h3>
                            <p class="product-desc">${item.description || 'No description available.'}</p>
                        </div>

                    </div>
                `).join('')}
            </div>
        `;

                container.appendChild(section);
            }

            // categorieën lijst bijwerken
            renderCategoryList(products);
        }

        function addToCart(productId) {


            let cart = JSON.parse(sessionStorage.getItem("cart")) || [];

            const product = allProducts.find(p => p.id == productId);

            const existing = cart.find(p => p.id == productId);

            if (existing) {
                existing.quantity++;
            } else {

                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    quantity: 1
                });

            }

            sessionStorage.setItem("cart", JSON.stringify(cart));
        }

        fetchProducts();

    </script>

    <div id="cart-popup">Toegevoegd aan winkelmand</div>

    <script>
        function showCartPopup() {

            console.log("Showing cart popup");

            const popup = document.getElementById("cart-popup");

            popup.classList.add("show");

            setTimeout(() => {
                popup.classList.remove("show");
            }, 1000);

        }
    </script>


    <div class="bottom-bar">
        <button onclick="window.location.href= 'cart.html'" class="btn-cart">Winkelmand
            <span class="cart-count" id="cart-count"></span>
        </button>
    </div>


    <script>

        fetch('/api/add_to_cart.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product_id: 5 })
        });

        fetch('/api/create_order.php', {
            method: 'POST'
        })
            .then(res => res.json())
            .then(data => {
                alert("Bestelling geplaatst! Pickup nummer: " + data.pickup_number);
            });

    </script>

    <script>
        function updateCartCount() {
            const cart = JSON.parse(sessionStorage.getItem("cart")) || [];
            const count = cart.reduce((total, item) => total + item.quantity, 0);
            document.getElementById("cart-count").textContent = count;
        }

        // Roep dit aan nadat je cart aanpast
        function addToCart(productId) {
            console.log("Adding product to cart:", productId);
            showCartPopup();
            let cart = JSON.parse(sessionStorage.getItem("cart")) || [];
            const product = allProducts.find(p => p.id == productId);
            const existing = cart.find(p => p.id == productId);

            if (existing) {
                existing.quantity++;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    quantity: 1
                });
            }

            sessionStorage.setItem("cart", JSON.stringify(cart));

            updateCartCount(); // update badge
        }

        // Initialiseer bij paginalaad
        updateCartCount();
    </script>
</body>

</html>
